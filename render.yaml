# Blueprint: one free Web Service hosts API + UI (no credit card).
# https://dashboard.render.com → New → Blueprint → connect this repo.
#
# Free = 512 MB RAM. PyTorch is tight; if the service OOMs, use Quick demos only
# or upgrade later. Free instances also sleep after ~15 minutes idle.

services:
  - type: web
    name: attack2defense
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: A2D_SECRET_KEY
        generateValue: true
      - key: A2D_DOWNLOAD_DATA
        value: "true"
      - key: A2D_MAX_TRAIN_EPOCHS
        value: "3"
      - key: A2D_MAX_TRAIN_BATCHES
        value: "40"
      - key: A2D_MAX_EVAL_IMAGES_PER_CLASS
        value: "10"
      - key: A2D_MAX_ATTACK_BATCH
        value: "2"
      # Keep Torch from grabbing huge thread pools on a tiny free instance.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
