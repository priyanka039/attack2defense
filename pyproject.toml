[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack2defense"
version = "1.0.0"
description = "Adversarial attacks (FGSM, PGD) and adversarial-training defenses on CIFAR-10."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
attack2defense = "attack2defense.cli:main"

[tool.setuptools]
packages = ["attack2defense"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks", "*.ipynb", "results", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]
