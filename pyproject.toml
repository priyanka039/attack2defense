[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack2defense"
version = "1.0.0"
description = "Adversarial attacks (FGSM, PGD) and adversarial-training defenses on CIFAR-10."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
]
dev = ["ruff>=0.5", "pytest>=8.0", "torchattacks>=3.5"]

[project.scripts]
attack2defense = "attack2defense.cli:main"

[tool.setuptools]
packages = ["attack2defense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks", "*.ipynb", "results", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]
